name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ (${{ matrix.compiler }}, sanitizers)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then export CXX=clang++; else export CXX=g++; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMICROPRICE_SANITIZE=ON -DMICROPRICE_BUILD_PYTHON=OFF -DMICROPRICE_BUILD_BENCH=OFF
      - run: cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure -j 4

  python:
    name: Python, q fallback and strategy parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd research && uv sync
      - name: Build the engine module
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMICROPRICE_BUILD_TESTS=OFF -DMICROPRICE_BUILD_BENCH=OFF -DPython_EXECUTABLE=$PWD/research/.venv/bin/python
          cmake --build build -j 4 --target _engine
      - run: cd research && uv run ruff check microprice tests && uv run ruff format --check microprice tests
      - run: cd research && uv run mypy
      - run: cd research && uv run pytest -q

  r:
    name: R analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages(c("testthat", "jsonlite"), repos = "https://cloud.r-project.org")'
      - run: cd analysis && Rscript tests/testthat.R

  dashboard:
    name: Dashboard (types, lint, contrast and axe tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: cd dashboard && npm ci
      - run: cd dashboard && npx tsc -b && npm run lint && npm test && npx vite build

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
